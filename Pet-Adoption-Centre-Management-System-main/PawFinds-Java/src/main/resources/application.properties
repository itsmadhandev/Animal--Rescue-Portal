# Application Configuration
spring.application.name=PawFinds Pet Adoption System
server.port=8081

# Database Configuration (H2 for development)
spring.datasource.url=jdbc:h2:mem:pawfindsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MySQL Configuration (uncomment for production)
#spring.datasource.url=jdbc:mysql://localhost:3306/pawfinds_db?useSSL=false&serverTimezone=UTC
#spring.datasource.username=root
#spring.datasource.password=your_password
#spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/pawfinds_db
spring.data.mongodb.database=pawfinds_db
# For MongoDB Atlas (cloud), use this format instead:
#spring.data.mongodb.uri=mongodb+srv://<username>:<password>@cluster.mongodb.net/pawfinds_db?retryWrites=true&w=majority

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.pawfinds.adoption=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO

# CORS Configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.web.cors.allowed-headers=*
